name: Build Android APK

on:
  push:
    branches: [ "main", "master", "production-hardening" ]
  pull_request:
    branches: [ "main", "master", "production-hardening" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias musicplayer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidmusicplayer \
            -keypass androidmusicplayer \
            -dname "CN=AudioIndexer, OU=MusicPlayer, O=AudioIndexer, L=City, ST=State, C=US"

      - name: Run Unit Tests and Build Signed Release APK with Gradle
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug --stacktrace
        env:
          KEYSTORE_PASSWORD: "androidmusicplayer"
          KEY_ALIAS: "musicplayer"
          KEY_PASSWORD: "androidmusicplayer"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
